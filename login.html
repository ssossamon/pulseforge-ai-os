<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — PulseForge AI OS</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <h1>Sign in</h1>
    <p>Welcome back to PulseForge AI OS.</p>
    <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" required></div>
    <button class="btn btn-gold" id="submitBtn" style="width:100%">Sign in</button>
    <div class="msg" id="msg"></div>
    <div class="gate-alt">No account yet? <a href="/register.html" style="color:var(--gold);">Create one</a></div>
  </div>
</div>
<script>
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

async function submit() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  msg.textContent = ''; msg.className = 'msg';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/.netlify/functions/auth-login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('pfai_token', data.token);
      localStorage.setItem('pfai_user', JSON.stringify(data.user));
      window.location.href = data.user.isAdmin ? '/admin.html' : '/app.html';
    } else {
      msg.textContent = data.error || 'Could not sign in.'; msg.className = 'msg err';
    }
  } catch (err) {
    msg.textContent = 'Could not reach the server.'; msg.className = 'msg err';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}
</script>
</body>
</html>
