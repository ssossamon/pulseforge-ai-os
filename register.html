<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — PulseForge AI OS</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <h1>Create your account</h1>
    <p>Free to start. Upgrade any time with a license key.</p>
    <div class="field"><label for="name">Name (optional)</label><input type="text" id="name"></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="At least 8 characters" required></div>
    <button class="btn btn-gold" id="submitBtn" style="width:100%">Create account</button>
    <div class="msg" id="msg"></div>
    <div class="gate-alt">Already have an account? <a href="/login.html" style="color:var(--gold);">Sign in</a></div>
  </div>
</div>
<script>
document.getElementById('submitBtn').addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  msg.textContent = ''; msg.className = 'msg';
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const res = await fetch('/.netlify/functions/auth-register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('pfai_token', data.token);
      localStorage.setItem('pfai_user', JSON.stringify(data.user));
      window.location.href = data.user.isAdmin ? '/admin.html' : '/app.html';
    } else {
      msg.textContent = data.error || 'Could not create account.'; msg.className = 'msg err';
    }
  } catch (err) {
    msg.textContent = 'Could not reach the server.'; msg.className = 'msg err';
  } finally {
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
